---
- name: Deploy ACL on dc_gateway
  hosts: dc_gateway
  gather_facts: false

  vars:
    nautobot_url: "{{ lookup('env', 'NAUTOBOT_URL') }}"
    nautobot_token: "{{ lookup('env', 'NAUTOBOT_TOKEN') }}"

  tasks:
    - name: "Step 4 | Fetch dc_gateway config context from Nautobot"
      ansible.builtin.uri:
        url: "{{ nautobot_url }}/api/dcim/devices/?name=dc_gateway"
        method: GET
        headers:
          Authorization: "Token {{ nautobot_token }}"
          Accept: "application/json"
        return_content: true
      register: nb_response
      delegate_to: localhost

    - name: "Step 4 | Extract access matrix from config context"
      ansible.builtin.set_fact:
        acl_rules: "{{ nb_response.json.results[0].local_config_context_data.acl_rules }}"

    - name: "Step 4 | Retrieved access control rules"
      ansible.builtin.debug:
        var: acl_rules

    - name: "Step 5 | Render iptables rules file from template"
      ansible.builtin.template:
        src: templates/acl.iptables.j2
        dest: /tmp/acl.iptables

    - name: "Step 6 | Apply ACL by running iptables commands"
      ansible.builtin.shell: sh /tmp/acl.iptables

    - name: "Step 6 | Read applied FORWARD chain rules"
      ansible.builtin.command: iptables -L FORWARD -n --line-numbers
      register: iptables_state
      changed_when: false

    - name: "Summary | Current FORWARD chain state on dc_gateway"
      ansible.builtin.debug:
        var: iptables_state.stdout_lines
